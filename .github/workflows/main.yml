name: PayTrack CI/CD

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build pay-tracking image
        run: docker build -t pay-tracking:latest .

      - name: Tag image for Docker Hub
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAG="latest"
          else
            TAG="staging"
          fi

          docker tag pay-tracking:latest \
          chizzycandy/pay-tracking:${TAG}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAG="latest"
          else
            TAG="staging"
          fi

          docker push chizzycandy/pay-tracking:${TAG}
